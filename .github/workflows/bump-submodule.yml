name: Bump Submodule

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full 40-char SHA from job-board-shared'
        required: true
        type: string

concurrency:
  group: bump-submodule
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  SUBMODULE_PATH: .github/scripts/shared
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: CDN propagation wait
        run: |
          echo "Waiting 120s for CDN propagation..."
          sleep 120

      - name: Validate SHA format
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid SHA format: $TARGET_SHA (expected 40-char hex)"
            exit 1
          fi
          echo "SHA format valid: ${TARGET_SHA:0:12}..."

      - name: Validate SHA exists in job-board-shared
        run: |
          RESPONSE=$(gh api "repos/zapplyjobs/job-board-shared/commits/$TARGET_SHA" \
            --jq '.sha' 2>&1) || true
          if [[ "$RESPONSE" != "$TARGET_SHA" ]]; then
            echo "::error::SHA $TARGET_SHA does NOT exist in job-board-shared."
            echo "API response: $RESPONSE"
            echo "This is a phantom SHA — aborting before any repos are touched."
            exit 1
          fi
          echo "SHA existence verified: ${TARGET_SHA:0:12} resolves to commit on job-board-shared"

      - name: Disable dangerous workflows
        id: disable-workflows
        run: |
          # Per-workflow disable/enable API works with repo scope.
          # Repo-level actions/permissions requires admin scope (GH_PAT lacks it).
          # Only disable workflows that could race with the bump (checkout submodules).

          # Aggregator: Fetch All Jobs (234555372)
          gh api repos/zapplyjobs/jobs-aggregator-private/actions/workflows/234555372/disable --method PUT --silent && echo "Disabled: aggregator/Fetch All Jobs" || echo "WARN: Could not disable aggregator/Fetch All Jobs"

          # jobs-data-2026: Enrich Jobs (239692001)
          gh api repos/zapplyjobs/jobs-data-2026/actions/workflows/239692001/disable --method PUT --silent && echo "Disabled: jobs-data/Enrich Jobs" || echo "WARN: Could not disable jobs-data/Enrich Jobs"

          # Consumer repos: Update Jobs from Aggregator
          declare -A CONSUMER_WORKFLOWS=(
            ["New-Grad-Jobs-2026"]="172507830"
            ["Internships-2026"]="197229424"
            ["New-Grad-Software-Engineering-Jobs-2026"]="194987480"
            ["New-Grad-Data-Science-Jobs-2026"]="181160192"
            ["New-Grad-Hardware-Engineering-Jobs-2026"]="181164092"
            ["New-Grad-Healthcare-Jobs-2026"]="189226548"
          )
          for REPO in "${!CONSUMER_WORKFLOWS[@]}"; do
            WF_ID="${CONSUMER_WORKFLOWS[$REPO]}"
            gh api "repos/zapplyjobs/$REPO/actions/workflows/$WF_ID/disable" --method PUT --silent && echo "Disabled: $REPO/Update Jobs" || echo "WARN: Could not disable $REPO/Update Jobs"
          done

      - name: Bump all 8 repos
        id: bump
        run: |
          REPOS=(
            zapplyjobs/jobs-aggregator-private
            zapplyjobs/jobs-data-2026
            zapplyjobs/New-Grad-Jobs-2026
            zapplyjobs/Internships-2026
            zapplyjobs/New-Grad-Software-Engineering-Jobs-2026
            zapplyjobs/New-Grad-Data-Science-Jobs-2026
            zapplyjobs/New-Grad-Hardware-Engineering-Jobs-2026
            zapplyjobs/New-Grad-Healthcare-Jobs-2026
          )
          SHORT_SHA="${TARGET_SHA:0:7}"
          PASS=0
          FAIL=0
          RESULTS=""

          for REPO in "${REPOS[@]}"; do
            REPO_NAME="${REPO#zapplyjobs/}"
            SUCCESS=false

            for ATTEMPT in 1 2 3; do
              # Fetch fresh HEAD
              HEAD=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null) || {
                echo "  [$ATTEMPT/3] $REPO_NAME: Failed to fetch HEAD"
                sleep 5
                continue
              }

              # Get current tree
              TREE=$(gh api "repos/$REPO/git/commits/$HEAD" --jq '.tree.sha' 2>/dev/null) || {
                echo "  [$ATTEMPT/3] $REPO_NAME: Failed to fetch tree"
                sleep 5
                continue
              }

              # Create new tree with updated submodule SHA
              TREE_INPUT=$(printf '{"base_tree":"%s","tree":[{"path":"%s","mode":"160000","type":"commit","sha":"%s"}]}' "$TREE" "$SUBMODULE_PATH" "$TARGET_SHA")
              NEW_TREE=$(echo "$TREE_INPUT" | gh api "repos/$REPO/git/trees" \
                --method POST \
                --input - \
                --jq '.sha' 2>/dev/null) || {
                echo "  [$ATTEMPT/3] $REPO_NAME: Failed to create tree"
                sleep 5
                continue
              }

              # Create commit
              COMMIT_INPUT=$(printf '{"message":"chore: bump submodule to %s","tree":"%s","parents":["%s"]}' "$SHORT_SHA" "$NEW_TREE" "$HEAD")
              NEW_COMMIT=$(echo "$COMMIT_INPUT" | gh api "repos/$REPO/git/commits" \
                --method POST \
                --input - \
                --jq '.sha' 2>/dev/null) || {
                echo "  [$ATTEMPT/3] $REPO_NAME: Failed to create commit"
                sleep 5
                continue
              }

              # Update ref
              REF_INPUT=$(printf '{"sha":"%s","force":false}' "$NEW_COMMIT")
              UPDATE_RESULT=$(echo "$REF_INPUT" | gh api "repos/$REPO/git/refs/heads/main" \
                --method PATCH \
                --input - \
                --jq '.object.sha' 2>/dev/null)

              if [ $? -eq 0 ] && [ -n "$UPDATE_RESULT" ]; then
                echo "  PASS: $REPO_NAME -> ${UPDATE_RESULT:0:12}"
                RESULTS="${RESULTS}PASS: ${REPO_NAME}\n"
                PASS=$((PASS + 1))
                SUCCESS=true
                break
              else
                echo "  [$ATTEMPT/3] $REPO_NAME: Non-fast-forward (race), retrying..."
                sleep 5
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "  FAIL: $REPO_NAME (3 attempts)"
              RESULTS="${RESULTS}FAIL: ${REPO_NAME}\n"
              FAIL=$((FAIL + 1))
            fi
          done

          echo -e "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bumped: $PASS passed, $FAIL failed" >> "$GITHUB_STEP_SUMMARY"
          echo "pass_count=$PASS" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL" >> "$GITHUB_OUTPUT"

          if [ "$FAIL" -gt 0 ]; then
            echo "::warning::$FAIL repo(s) failed to bump. Re-run with same SHA for failed repos."
          fi

      - name: Re-enable dangerous workflows
        if: always()
        run: |
          # Aggregator: Fetch All Jobs (234555372)
          gh api repos/zapplyjobs/jobs-aggregator-private/actions/workflows/234555372/enable --method PUT --silent && echo "Enabled: aggregator/Fetch All Jobs" || echo "WARN: Could not enable aggregator/Fetch All Jobs"

          # jobs-data-2026: Enrich Jobs (239692001)
          gh api repos/zapplyjobs/jobs-data-2026/actions/workflows/239692001/enable --method PUT --silent && echo "Enabled: jobs-data/Enrich Jobs" || echo "WARN: Could not enable jobs-data/Enrich Jobs"

          # Consumer repos: Update Jobs from Aggregator
          declare -A CONSUMER_WORKFLOWS=(
            ["New-Grad-Jobs-2026"]="172507830"
            ["Internships-2026"]="197229424"
            ["New-Grad-Software-Engineering-Jobs-2026"]="194987480"
            ["New-Grad-Data-Science-Jobs-2026"]="181160192"
            ["New-Grad-Hardware-Engineering-Jobs-2026"]="181164092"
            ["New-Grad-Healthcare-Jobs-2026"]="189226548"
          )
          for REPO in "${!CONSUMER_WORKFLOWS[@]}"; do
            WF_ID="${CONSUMER_WORKFLOWS[$REPO]}"
            gh api "repos/zapplyjobs/$REPO/actions/workflows/$WF_ID/enable" --method PUT --silent && echo "Enabled: $REPO/Update Jobs" || echo "WARN: Could not enable $REPO/Update Jobs"
          done

      - name: Verify P-2 alignment
        run: |
          REPOS=(
            zapplyjobs/jobs-aggregator-private
            zapplyjobs/jobs-data-2026
            zapplyjobs/New-Grad-Jobs-2026
            zapplyjobs/Internships-2026
            zapplyjobs/New-Grad-Software-Engineering-Jobs-2026
            zapplyjobs/New-Grad-Data-Science-Jobs-2026
            zapplyjobs/New-Grad-Hardware-Engineering-Jobs-2026
            zapplyjobs/New-Grad-Healthcare-Jobs-2026
          )
          P2_FAIL=0

          echo "### P-2 Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected: ${TARGET_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for REPO in "${REPOS[@]}"; do
            REPO_NAME="${REPO#zapplyjobs/}"
            ACTUAL=$(gh api "repos/$REPO/contents/$SUBMODULE_PATH" --jq '.sha' 2>/dev/null || echo "FETCH_ERROR")

            if [ "$ACTUAL" = "$TARGET_SHA" ]; then
              echo "  $REPO_NAME: ${ACTUAL:0:12} OK" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "  $REPO_NAME: ${ACTUAL:0:12} MISMATCH (expected ${TARGET_SHA:0:12})" | tee -a "$GITHUB_STEP_SUMMARY"
              P2_FAIL=$((P2_FAIL + 1))
            fi

            # Empty-tree guard
            HEAD=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || echo "")
            if [ -n "$HEAD" ]; then
              FILE_COUNT=$(gh api "repos/$REPO/git/trees/$HEAD" --jq '.tree | length' 2>/dev/null || echo "0")
              if [ "$FILE_COUNT" -lt 5 ]; then
                echo "  CRITICAL: $REPO_NAME has $FILE_COUNT files -- tree corruption" | tee -a "$GITHUB_STEP_SUMMARY"
                P2_FAIL=$((P2_FAIL + 1))
              fi
            fi
          done

          if [ "$P2_FAIL" -gt 0 ]; then
            echo "::error::P-2 verification failed: $P2_FAIL mismatch(es)"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**P-2 PASS** -- all 8 repos aligned at ${TARGET_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"

      - name: Final report
        if: always()
        run: |
          echo "### Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target SHA: \`${TARGET_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bump: ${{ steps.bump.outputs.pass_count }} passed, ${{ steps.bump.outputs.fail_count }} failed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
