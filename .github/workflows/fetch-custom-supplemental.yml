name: Fetch Custom Supplemental

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'  # AGG-SLOW-LANE-1: every 2 hours

concurrency:
  group: fetch-custom-supplemental
  cancel-in-progress: false

jobs:
  fetch-custom-supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Google concurrency=3 (~3min) + Microsoft (~2min) + Apple (~30s) + ByteDance (~2s)
    permissions:
      contents: read

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -f HEAD -- .
          echo "Decrypt verification:" && head -1 .github/scripts/index.js 2>/dev/null || echo "(no index.js)"
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory
        run: mkdir -p .github/data

      - name: Seed description sidecars from R2
        run: |
          for sidecar in google microsoft apple; do
            node -e "
            const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
            async function main() {
              const r2 = createR2Client({ prefix: 'data/' });
              const result = await r2.downloadToFile('descriptions-${sidecar}.jsonl', '.github/data/descriptions-${sidecar}.jsonl');
              if (result) { console.log('R2_OK'); } else { process.exit(1); }
            }
            main().catch(() => process.exit(1));
            " && echo "Seeded ${sidecar}" || echo "No ${sidecar} cache yet"
          done
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Seed previous supplemental jobs from R2 (for incremental state)
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const result = await r2.downloadToFile('supplemental-custom-jobs.json', '.github/data/supplemental-custom-jobs.json');
            if (result) { console.log('R2_OK'); } else { process.exit(1); }
          }
          main().catch(() => process.exit(1));
          " && echo "Seeded previous supplemental jobs" || echo "No previous supplemental jobs (first run)"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Fetch custom supplemental lane
        run: node .github/scripts/fetch-supplemental-custom.js
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Verify output files
        run: |
          test -f .github/data/supplemental-custom-jobs.json
          test -f .github/data/supplemental-custom-metadata.json
          python3 - <<'PY'
          import json
          jobs = json.load(open('.github/data/supplemental-custom-jobs.json'))
          meta = json.load(open('.github/data/supplemental-custom-metadata.json'))
          assert isinstance(jobs, list)
          assert meta.get('source') == 'custom'
          assert meta.get('schema') == 'supplemental-lane-v1'
          assert meta.get('lane_name') == 'custom'
          contract = meta.get('publish_contract') or {}
          assert contract.get('blocks_fast_publish') is False
          assert contract.get('included_in_main_all_jobs') is False
          assert contract.get('merge_mode') == 'separate_artifact'
          assert contract.get('visibility') == 'snapshot_only'
          declared = set(meta.get('sources', {}).keys())
          assert declared <= {'google','microsoft','apple','bytedance','amazon'}, f"unexpected sources: {declared}"
          print('jobs', len(jobs))
          print('sources', meta['sources'])
          PY

      - name: Display custom supplemental summary
        if: always()
        run: |
          cat .github/data/supplemental-custom-metadata.json | jq .
