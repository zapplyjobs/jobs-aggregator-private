name: Fetch All Jobs

on:
  workflow_dispatch:  # Triggered by job-board-cron-worker (Cloudflare) every 15 min
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/**'

# Prevent concurrent runs
concurrency:
  group: job-fetch
  cancel-in-progress: false

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 1  # Shallow clone — rebase fetches missing objects on demand
        submodules: recursive
        token: ${{ secrets.GH_PAT }}

    - name: Fix submodule index
      run: |
        # Workaround for GitHub Actions submodule checkout caching issue
        # Force git to recompute submodule index from the tree
        git submodule sync --recursive
        git submodule update --init --force --recursive

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tag-engine tests (non-blocking — tag-engine.js is git-crypt encrypted)
      continue-on-error: true
      run: cd .github/scripts/shared && [ -f lib/aggregator/processors/tag-engine.js ] && node lib/__tests__/tag-engine.test.js || echo "⚠️ tag-engine.js not decrypted — skipping tests"

    - name: Create logs directory
      run: mkdir -p .github/logs .github/data

    - name: "Seed all_jobs.json from R2 (fallback: GitHub)"
      run: |
        echo "📥 Seeding previous all_jobs.json..."
        node -e "
        const { createR2Client } = require('./.github/scripts/shared/lib/storage/r2-client');
        const fs = require('fs');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const raw = await r2.downloadRaw('all_jobs.json');
          if (raw && raw.length > 0) {
            fs.writeFileSync('.github/data/all_jobs.json', Buffer.from(raw));
            const lines = raw.toString().split('\n').filter(l => l.trim()).length;
            console.log('✅ R2 seed OK: ' + lines + ' jobs');
          } else {
            console.log('⚠️ R2 empty — GitHub fallback');
            process.exit(1);
          }
        }
        main().catch(e => { console.error('R2 error: ' + e.message); process.exit(1); });
        " || \
        curl -sf "https://raw.githubusercontent.com/zapplyjobs/jobs-data-2026/main/.github/data/all_jobs.json?t=$(date +%s)" \
          -o .github/data/all_jobs.json && \
          echo "✅ GitHub fallback: seeded $(wc -l < .github/data/all_jobs.json) jobs" || \
          echo "⚠️ Could not seed all_jobs.json — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed descriptions-enriched from R2 (fallback: GitHub)"
      run: |
        echo "📥 Seeding enriched descriptions (WD/SR)..."
        # TAG-7: WD/SR descriptions needed before tagging (Step 5) for description fallback.
        # INF-BLOAT-6: Fetch ALL chunks (pool uses 19+ chunks).
        # AGG-PIPE-18 Phase A: R2-first seeding. Falls back to GitHub curl per chunk.
        TOTAL=0
        for CHUNK in $(seq 1 30); do
          CHUNK_FILE="descriptions-enriched-${CHUNK}.jsonl"
          node -e "
          const { createR2Client } = require('./.github/scripts/shared/lib/storage/r2-client');
          const fs = require('fs');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const raw = await r2.downloadRaw('${CHUNK_FILE}');
            if (raw && raw.length > 0) {
              fs.writeFileSync('.github/data/${CHUNK_FILE}', Buffer.from(raw));
              const lines = raw.toString().split('\n').filter(l => l.trim()).length;
              console.log(lines);
            } else { process.exit(1); }
          }
          main().catch(() => process.exit(1));
          " 2>/dev/null && \
            LINES=$(wc -l < ".github/data/${CHUNK_FILE}") && \
            TOTAL=$((TOTAL + LINES)) && \
            echo "  chunk ${CHUNK}: ${LINES} entries (R2)" || \
            curl -sf "https://raw.githubusercontent.com/zapplyjobs/jobs-data-2026/main/.github/data/${CHUNK_FILE}?t=$(date +%s)" \
              -o ".github/data/${CHUNK_FILE}" 2>/dev/null && \
              LINES=$(wc -l < ".github/data/${CHUNK_FILE}") && \
              TOTAL=$((TOTAL + LINES)) && \
              echo "  chunk ${CHUNK}: ${LINES} entries (GitHub)" || \
              echo "  chunk ${CHUNK}: not found (skipped)"
        done
        [ $TOTAL -gt 0 ] && echo "✅ Seeded ${TOTAL} enriched descriptions total" || \
          echo "⚠️ No descriptions-enriched chunks found — description fallback will be inactive"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed descriptions-jsearch.jsonl from R2 (fallback: GitHub)"
      run: |
        echo "📥 Seeding JSearch description cache..."
        node -e "
        const { createR2Client } = require('./.github/scripts/shared/lib/storage/r2-client');
        const fs = require('fs');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const raw = await r2.downloadRaw('descriptions-jsearch.jsonl');
          if (raw && raw.length > 0) {
            fs.writeFileSync('.github/data/descriptions-jsearch.jsonl', Buffer.from(raw));
            const lines = raw.toString().split('\n').filter(l => l.trim()).length;
            console.log('✅ R2 seed OK: ' + lines + ' entries');
          } else { process.exit(1); }
        }
        main().catch(() => process.exit(1));
        " || \
        curl -sf "https://raw.githubusercontent.com/zapplyjobs/jobs-data-2026/main/.github/data/descriptions-jsearch.jsonl?t=$(date +%s)" \
          -o .github/data/descriptions-jsearch.jsonl && \
          echo "✅ GitHub fallback: $(wc -l < .github/data/descriptions-jsearch.jsonl) entries" || \
          echo "⚠️ No descriptions-jsearch.jsonl yet — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed descriptions-microsoft.jsonl from R2 (fallback: GitHub)"
      run: |
        echo "📥 Seeding Microsoft description cache..."
        # AGG-SPEED-4: Seed prior Microsoft descriptions so the fetcher can skip cached positions.
        node -e "
        const { createR2Client } = require('./.github/scripts/shared/lib/storage/r2-client');
        const fs = require('fs');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const raw = await r2.downloadRaw('descriptions-microsoft.jsonl');
          if (raw && raw.length > 0) {
            fs.writeFileSync('.github/data/descriptions-microsoft.jsonl', Buffer.from(raw));
            const lines = raw.toString().split('\n').filter(l => l.trim()).length;
            console.log('✅ R2 seed OK: ' + lines + ' entries');
          } else { process.exit(1); }
        }
        main().catch(() => process.exit(1));
        " || \
        curl -sf "https://raw.githubusercontent.com/zapplyjobs/jobs-data-2026/main/.github/data/descriptions-microsoft.jsonl?t=$(date +%s)" \
          -o .github/data/descriptions-microsoft.jsonl && \
          echo "✅ GitHub fallback: $(wc -l < .github/data/descriptions-microsoft.jsonl) entries" || \
          echo "⚠️ No descriptions-microsoft.jsonl yet — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: Fetch jobs from all sources
      run: set -o pipefail; node .github/scripts/index.js 2>&1 | tee .github/logs/fetch.log
      env:
        JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

    - name: Post-deploy invariant checks
      run: |
        echo "🔍 Running post-deploy invariant checks..."
        PASS=true

        # 1. all_jobs.json exists and has >20,000 lines
        if [ ! -f ".github/data/all_jobs.json" ]; then
          echo "❌ all_jobs.json missing"
          PASS=false
        else
          LINE_COUNT=$(wc -l < .github/data/all_jobs.json)
          if [ "$LINE_COUNT" -lt 20000 ]; then
            echo "❌ all_jobs.json: $LINE_COUNT lines (expected >20000)"
            PASS=false
          else
            echo "✅ all_jobs.json: $LINE_COUNT lines"
          fi
        fi

        # 2. tags object present on a sample of records
        TAGGED=$(head -5 .github/data/all_jobs.json | python3 -c "
        import sys, json
        ok = sum(1 for l in sys.stdin if l.strip() and 'tags' in json.loads(l))
        print(ok)
        " 2>/dev/null || echo 0)
        if [ "$TAGGED" -lt 5 ]; then
          echo "❌ tags field missing on sampled records ($TAGGED/5 have it)"
          PASS=false
        else
          echo "✅ tags field present on sampled records"
        fi

        # 3. source field present on records
        SOURCED=$(head -5 .github/data/all_jobs.json | python3 -c "
        import sys, json
        ok = sum(1 for l in sys.stdin if l.strip() and json.loads(l).get('source'))
        print(ok)
        " 2>/dev/null || echo 0)
        if [ "$SOURCED" -lt 5 ]; then
          echo "❌ source field missing on sampled records ($SOURCED/5 have it)"
          PASS=false
        else
          echo "✅ source field present on sampled records"
        fi

        # 4. is_direct_apply field present on at least one JSearch record
        JSEARCH_WITH_FLAG=$(python3 -c "
        import json
        count = 0
        with open('.github/data/all_jobs.json') as f:
          for line in f:
            line = line.strip()
            if not line: continue
            j = json.loads(line)
            if j.get('source') == 'jsearch' and 'is_direct_apply' in j:
              count += 1
              if count >= 1: break
        print(count)
        " 2>/dev/null || echo 0)
        if [ "$JSEARCH_WITH_FLAG" -lt 1 ]; then
          echo "⚠️  is_direct_apply field not yet on JSearch records (may appear after TTL refresh)"
        else
          echo "✅ is_direct_apply present on JSearch records"
        fi

        # 5. jobs-metadata.json has freshness and top_companies (new fields from df7e6a4)
        if [ -f ".github/data/jobs-metadata.json" ]; then
          HAS_FRESHNESS=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        print(1 if 'freshness' in m and 'top_companies' in m else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_FRESHNESS" -eq 1 ]; then
            echo "✅ jobs-metadata.json has freshness + top_companies fields"
          else
            echo "❌ jobs-metadata.json missing freshness or top_companies fields"
            PASS=false
          fi
        fi

        # AGG-PIPE-8: File-existence checks for critical submodule files.
        # Origin: d06bb81 deleted tag-engine.js, pipeline produced corrupt output for 7h.

        # 6. tag-engine.js exists and exports expected functions
        TAG_ENGINE_PATH=".github/scripts/aggregator/lib/aggregator/processors/tag-engine.js"
        if [ ! -f "$TAG_ENGINE_PATH" ]; then
          echo "❌ tag-engine.js MISSING — pipeline will produce corrupt output"
          PASS=false
        else
          TAG_LINE_COUNT=$(wc -l < "$TAG_ENGINE_PATH")
          if [ "$TAG_LINE_COUNT" -lt 100 ]; then
            echo "❌ tag-engine.js: $TAG_LINE_COUNT lines (expected >3000) — likely truncated"
            PASS=false
          else
            echo "✅ tag-engine.js: $TAG_LINE_COUNT lines"
          fi
        fi

        # 7. company-list.json is parseable with expected platforms
        CL_PATH=".github/scripts/aggregator/lib/aggregator/fetchers/company-list.json"
        if [ ! -f "$CL_PATH" ]; then
          echo "❌ company-list.json MISSING — fetchers have no tenant list"
          PASS=false
        else
          CL_PLATFORMS=$(python3 -c "
        import json
        cl = json.load(open('$CL_PATH'))
        platforms = set(cl.keys())
        required = {'greenhouse', 'lever', 'ashby', 'workday', 'smartrecruiters'}
        missing = required - platforms
        print('MISSING:' + ','.join(missing) if missing else 'OK')
        " 2>/dev/null || echo "MISSING:parse-error")
          if [[ "$CL_PLATFORMS" == MISSING:* ]]; then
            echo "❌ company-list.json missing platforms: ${CL_PLATFORMS#MISSING:}"
            PASS=false
          else
            echo "✅ company-list.json has all required platforms"
          fi
        fi

        # 8. deduplicator.js exports DEDUPE_TTL constants
        DEDUP_PATH=".github/scripts/aggregator/lib/aggregator/processors/deduplicator.js"
        if [ ! -f "$DEDUP_PATH" ]; then
          echo "❌ deduplicator.js MISSING — pipeline cannot deduplicate"
          PASS=false
        else
          HAS_TTL=$(grep -c "DEDUPE_TTL_DAYS" "$DEDUP_PATH" || echo 0)
          if [ "$HAS_TTL" -lt 1 ]; then
            echo "❌ deduplicator.js missing DEDUPE_TTL_DAYS export"
            PASS=false
          else
            echo "✅ deduplicator.js exports DEDUPE_TTL_DAYS"
          fi
        fi

        if [ "$PASS" = "true" ]; then
          echo "✅ All invariant checks passed"
        else
          echo "❌ One or more invariant checks failed — see above"
          exit 1
        fi


    - name: Upload data to R2 (additive)
      if: success()
      # continue-on-error removed — R2 upload failures now visible (INF-BLOAT-5)
      run: |
        echo "📤 Uploading pipeline data to R2 (parallel — AGG-SPEED-9)..."
        node -e "
        const { createR2Client } = require('./.github/scripts/shared/lib/storage/r2-client');
        const fs = require('fs');
        const path = require('path');

        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const dataDir = '.github/data';
          const files = [
            'all_jobs.json',
            'jobs-metadata.json',
            'dedupe-store.json',
          ];

          // Add description sidecars
          const sidecars = fs.readdirSync(dataDir).filter(f => f.startsWith('descriptions-') && f.endsWith('.jsonl'));
          for (const s of sidecars) files.push(s);

          // AGG-SPEED-9: Upload in parallel with concurrency 5
          const CONCURRENCY = 5;
          let ok = 0, fail = 0;

          async function uploadFile(file) {
            const fp = path.join(dataDir, file);
            if (!fs.existsSync(fp)) { console.log('SKIP: ' + file); return; }
            try {
              const data = fs.readFileSync(fp, 'utf8');
              const isJson = file.endsWith('.json');
              const uploaded = isJson
                ? await r2.uploadRaw(file, data, 'application/json')
                : await r2.uploadRaw(file, data, 'application/x-jsonlines');
              if (uploaded) { ok++; } else { fail++; }
            } catch (e) { console.error('ERR: ' + file + ' - ' + e.message); fail++; }
          }

          for (let i = 0; i < files.length; i += CONCURRENCY) {
            const batch = files.slice(i, i + CONCURRENCY);
            await Promise.all(batch.map(f => uploadFile(f)));
          }

          await r2.writeManifest({ files_uploaded: ok, files_failed: fail, pipeline_run: process.env.GITHUB_RUN_ID });
          console.log('R2 upload done: ' + ok + ' ok, ' + fail + ' failed');
        }
        main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
        "
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        GITHUB_RUN_ID: ${{ github.run_id }}


    - name: Display logs (always run)
      if: always()
      run: |
        echo "📋 Fetch Output (last 50 lines):"
        tail -50 .github/logs/fetch.log || echo "Log file not found"

    - name: Verify output files
      if: always()
      run: |
        echo "📊 Output Files:"
        ls -lh .github/data/all_jobs.json || echo "all_jobs.json not found"
        ls -lh .github/data/jobs-metadata.json || echo "jobs-metadata.json not found"
        ls -lh .github/data/dedupe-store.json || echo "dedupe-store.json not found"

    - name: Display job counts
      if: always()
      run: |
        if [ -f ".github/data/jobs-metadata.json" ]; then
          echo "📊 Job Statistics:"
          cat .github/data/jobs-metadata.json | jq '{
            total_jobs,
            unique_jobs,
            duplicates_removed,
            by_job_type,
            jsearch_stats
          }'
        fi

    - name: Push archive to jobs-archive-private
      if: success()
      run: |
        ARCHIVE_DIR=".github/data/archive"
        if [ ! -d "$ARCHIVE_DIR" ] || [ -z "$(ls -A $ARCHIVE_DIR 2>/dev/null)" ]; then
          echo "ℹ️ No archive files to push"
          exit 0
        fi

        echo "📤 Pushing archive files to jobs-archive-private..."
        git clone --depth=1 "https://x-access-token:${GH_PAT}@github.com/zapplyjobs/jobs-archive-private.git" /tmp/jobs-archive-private

        # Copy all weekly archive files
        mkdir -p /tmp/jobs-archive-private/data
        cp $ARCHIVE_DIR/*.jsonl /tmp/jobs-archive-private/data/ 2>/dev/null || true

        cd /tmp/jobs-archive-private
        git config user.email "bot@zapplyjobs.com"
        git config user.name "Data Bot"
        git add data/

        if [ -n "$(git status --porcelain)" ]; then
          WEEK=$(ls data/*.jsonl 2>/dev/null | tail -1 | xargs basename 2>/dev/null || echo "unknown")
          git commit -m "archive: update ${WEEK} - $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Archive push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "✅ Archive pushed to jobs-archive-private"
        else
          echo "ℹ️ No new archive data to push"
        fi
      env:
        GH_PAT: ${{ secrets.GH_PAT }}


    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Workflow failed - check logs above"
        echo "Last 30 lines of fetch log:"
        tail -30 .github/logs/fetch.log || echo "No log file"