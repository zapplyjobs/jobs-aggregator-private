name: Fetch All Jobs

on:
  workflow_dispatch:
  # schedule REMOVED (INF-FETCHJOBS-DUAL-TRIGGER-1): the CF Worker job-board-cron-worker
  # (*/15 + hasActiveWorkflowRun guard) is the SOLE trigger. GHA schedule caused a
  # dual-trigger that doubled dispatches + piled the throttled queue (ghost-throttle P0).

# Prevent concurrent runs
concurrency:
  group: job-fetch-v2  # AGG-GHOST-RUN-CADENCE-BLOCK-1: renamed to escape 10 ghost queued runs (uncancellable HTTP 500, stuck >24h from Aug-4 outage) blocking the old "job-fetch" group
  cancel-in-progress: false

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      NODE_OPTIONS: --max-old-space-size=14000  # AGG-FETCH-OOM-MEMORY-OPTIMIZATION-1 Phase 0 (operator-approved session, 2026-08-15): raised from 6656. The old comment's '7GB runner' premise was WRONG — this repo is PUBLIC and ubuntu-latest runners give 16GB/4vCPU free (verified: repo visibility + runs-on + GitHub docs). 14000 leaves ~2GB for OS/runner agent. This is a BRIDGE, not the fix: peak memory scales with pool size (~90KB/job, 74K pool measured ~6.6GB); the durable fix (stream writes, release fat set) is phased in the task record + projects/zjp/research/AGG_FETCH_MEMORY_ARCHITECTURE_2026_08_14.md.
      SKIP_WD_FAMILY_CACHE_BUILD: 1
      SKIP_WD_DESC_BACKFILL: '1'  # AGG-DESC-ASYNC-1: WD desc backfill moved to separate workflow
      SKIP_SR_DESC_BACKFILL: '1'  # AGG-DESC-ASYNC-1: SR desc backfill moved to separate workflow
      WD_FETCH_PROXY: https://wd-fetch-proxy.wild-queen-069e.workers.dev  # AGG-WD-PROXY-WIRE-1: bypass GHA Cloudflare IP-block
      DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}  # AGG-WD-PROXY-AUTH-HEADER-1: auth token for wd-fetch-proxy
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}  # AGG-R2ELIM-READMIGRATION-1: Storage-first reads via r2-client.js
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 1  # Shallow clone — rebase fetches missing objects on demand
        submodules: recursive
        token: ${{ secrets.GH_PAT }}

    - name: Install transcrypt
      run: |
        curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
        chmod +x /tmp/transcrypt
        sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

    - name: Unlock encrypted files
      run: |
        echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
        git checkout -- .
        git submodule foreach --recursive '
          echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
          rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
          git checkout HEAD -- . 2>/dev/null || true
        ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          # The foreach above uses || true (historical fragile unlock). This catches
          # a silent decryption failure BEFORE the pipeline runs ciphertext garbage.
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
      env:
        TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


    - name: Fix submodule index
      run: |
        # Workaround for GitHub Actions submodule checkout caching issue
        # Force git to recompute submodule index from the tree
        git submodule sync --recursive
        git submodule update --init --force --recursive

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
    - name: "Mark Oracle sidecar generation in progress (AGG-DESCBACKFILL-MARKER-1)"
      run: |
        MARKER='{"status":"in_progress","run_id":"'"${GITHUB_RUN_ID}"'","started_at":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"}'
        printf '%s' "$MARKER" > /tmp/fetch-jobs-sidecar-complete.json
        curl -sf -X PUT \
          "${SUPABASE_URL}/storage/v1/object/pipeline-data/fetch-jobs-sidecar-complete.json" \
          -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/fetch-jobs-sidecar-complete.json
        node <<'EOF'
        const fs = require('fs');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const marker = fs.readFileSync('/tmp/fetch-jobs-sidecar-complete.json');
        const r2 = createR2Client({ prefix: 'data/' });
        r2.uploadRaw('fetch-jobs-sidecar-complete.json', marker, 'application/json')
          .then(ok => { if (!ok) throw new Error('R2 marker upload returned false'); })
          .catch(err => { console.error(err.message); process.exit(1); });
        EOF
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


    - name: Run tag-engine tests (non-blocking — tag-engine.js is git-crypt encrypted)
      continue-on-error: true
      run: cd .github/scripts/shared && [ -f lib/aggregator/processors/tag-engine.js ] && node lib/__tests__/tag-engine.test.js || echo "⚠️ tag-engine.js not decrypted — skipping tests"

    - name: Create logs directory
      run: |
        mkdir -p .github/logs .github/data
        date -u +%s > .github/data/workflow-start.txt

    - name: "Seed all_jobs + dedupe + board-counts from R2 (canonical — AGG-R2PRIMARY-SEED)"
      run: |
        echo "📥 Seeding previous all_jobs + dedupe + board-counts from R2 (canonical)..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const fs = require('fs');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          try {
            await r2.downloadToFile('all_jobs.json', '.github/data/all_jobs.json');
            // AGG-STRING-CAP-READS: count lines by stream — the single-string read
            // crossed V8's ~536M-char cap at the 588MB all_jobs (2026-08-15).
            const readline = require('readline');
            let lines = 0;
            const rl = readline.createInterface({ input: fs.createReadStream('.github/data/all_jobs.json', 'utf8'), crlfDelay: Infinity });
            for await (const l of rl) { if (l.trim()) lines++; }
            rl.close();
            console.log('✅ Seed OK: ' + lines + ' jobs (R2)');
          } catch(e) { console.error('❌ R2 seed failed for all_jobs: ' + e.message); process.exit(1); }
          try { await r2.downloadToFile('dedupe-store.json', '.github/data/dedupe-store.json'); console.log('✅ dedupe-store (R2)'); }
          catch(e) { console.log('⚠️ dedupe-store: not found in R2 (first run)'); }
          try { await r2.downloadToFile('board-counts.json', '.github/data/board-counts.json'); console.log('✅ board-counts (R2)'); }
          catch(e) { console.log('⚠️ board-counts: not found in R2 (first run)'); }
        }
        main().catch(e => { console.error('Seed error: ' + e.message); process.exit(1); });
        "
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed descriptions-enriched from R2 (private R2 only)"
      run: |
        echo "📥 Seeding enriched descriptions (WD/SR)..."
        # TAG-7: WD/SR descriptions needed before tagging (Step 5) for description fallback.
        # A179 parity proof: current Workday + SmartRecruiters final-row tagging stays unchanged
        # with chunks 1-8 only, while those chunks cover about 97% of current enriched overlap.
        TOTAL=0
        for CHUNK in $(seq 1 8); do
          CHUNK_FILE="descriptions-enriched-${CHUNK}.jsonl"
          node -e "
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const result = await r2.downloadToFile('${CHUNK_FILE}', '.github/data/${CHUNK_FILE}');
            if (result) { console.log('OK'); } else { process.exit(1); }
          }
          main().catch(() => process.exit(1));
          " 2>/dev/null && \
            LINES=$(wc -l < ".github/data/${CHUNK_FILE}") && \
            TOTAL=$((TOTAL + LINES)) && \
            echo "  chunk ${CHUNK}: ${LINES} entries (R2)" || \
            echo "  chunk ${CHUNK}: not found in private R2 (skipped)"
        done
        [ $TOTAL -gt 0 ] && echo "✅ Seeded ${TOTAL} enriched descriptions total" || \
          echo "⚠️ No descriptions-enriched chunks found — description fallback will be inactive"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed pipeline-cycle-state.json from R2 (canonical)"
      run: |
        echo "📥 Seeding pipeline-cycle-state.json from R2..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          await r2.downloadToFile('pipeline-cycle-state.json', '.github/data/pipeline-cycle-state.json');
          console.log('✅ Seeded pipeline-cycle-state.json (R2)');
        }
        main().catch(() => console.log('⚠️ No pipeline-cycle-state.json in R2 — first run'));
        "
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed descriptions-jsearch.jsonl from R2 (private R2 only)"
      run: |
        echo "📥 Seeding JSearch description cache..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('descriptions-jsearch.jsonl', '.github/data/descriptions-jsearch.jsonl');
          if (result) { console.log('R2_OK'); } else { process.exit(1); }
        }
        main().catch(() => process.exit(1));
        " && echo "✅ R2 seed OK: $(wc -l < .github/data/descriptions-jsearch.jsonl) entries" || \
          echo "⚠️ No descriptions-jsearch.jsonl in private R2 — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed descriptions-microsoft.jsonl from R2 (private R2 only)"
      run: |
        echo "📥 Seeding Microsoft description cache..."
        # AGG-SPEED-4: Seed prior Microsoft descriptions so the fetcher can skip cached positions.
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('descriptions-microsoft.jsonl', '.github/data/descriptions-microsoft.jsonl');
          if (result) { console.log('R2_OK'); } else { process.exit(1); }
        }
        main().catch(() => process.exit(1));
        " && echo "✅ R2 seed OK: $(wc -l < .github/data/descriptions-microsoft.jsonl) entries" || \
          echo "⚠️ No descriptions-microsoft.jsonl in private R2 — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed remaining description sidecars from R2 (private R2 only)"
      run: |
        echo "📥 Seeding remaining description sidecars..."
        node - <<'NODE'
        const fs = require('fs');
        const path = require('path');
        const https = require('https');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const DATA_DIR = '.github/data';
        const GH_HEADERS = {
          'User-Agent': 'ZJP-Sidecar-Seed',
          'Authorization': `Bearer ${process.env.GH_PAT || process.env.GITHUB_TOKEN}`,
          'Accept': 'application/vnd.github.v3+json',
        };
        function getJson(url) {
          return new Promise((resolve, reject) => {
            https.get(url, { headers: GH_HEADERS }, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); }
                catch (e) { reject(e); }
              });
            }).on('error', reject);
          });
        }
        function download(url, target) {
          return new Promise((resolve, reject) => {
            const file = fs.createWriteStream(target);
            https.get(url, { headers: GH_HEADERS }, (res) => {
              if (res.statusCode !== 200) {
                file.close();
                fs.unlink(target, () => resolve(false));
                return;
              }
              res.pipe(file);
              file.on('finish', () => file.close(() => resolve(true)));
            }).on('error', err => {
              file.close();
              fs.unlink(target, () => reject(err));
            });
          });
        }
        async function main() {
          fs.mkdirSync(DATA_DIR, { recursive: true });
          const r2 = createR2Client({ prefix: 'data/' });
          let seeded = 0;
          const BATCH = 5; // AGG-RUNTIME-ALERT-1: parallel downloads instead of sequential
          try {
            const objects = await r2.list('descriptions-');
            for (let i = 0; i < objects.length; i += BATCH) {
              await Promise.all(objects.slice(i, i + BATCH).map(async (obj) => {
                const name = path.basename(obj.key || '');
                if (!/^descriptions-.*\.jsonl$/.test(name)) return;
                const target = path.join(DATA_DIR, name);
                if (fs.existsSync(target)) return;
                const result = await r2.downloadToFile(name, target);
                if (result) seeded++;
              }));
            }
          } catch {}
          let ghSeeded = 0;
          try {
            const listing = await getJson('https://api.github.com/repos/zapplyjobs/jobs-data-2026/contents/.github/data');
            for (let i = 0; i < listing.length; i += BATCH) {
              await Promise.all(listing.slice(i, i + BATCH).map(async (item) => {
                if (!item || !/^descriptions-.*\.jsonl$/.test(item.name || '')) return;
                const target = path.join(DATA_DIR, item.name);
                if (fs.existsSync(target)) return;
                const ok = await download(item.download_url, target);
                if (ok) ghSeeded++;
              }));
            }
          } catch {}
          console.log(`SEEDED_R2:${seeded}`);
          console.log(`SEEDED_GH:${ghSeeded}`);
        }
        main().catch(err => { console.error(err.message); process.exit(1); });
        NODE
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        GH_TOKEN: ${{ secrets.GH_PAT }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed filtered-samples.jsonl from R2 (private R2 only)"
      run: |
        echo "📥 Seeding filtered samples..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('filtered-samples.jsonl', '.github/data/filtered-samples.jsonl');
          if (result) { console.log('R2_OK'); } else { process.exit(1); }
        }
        main().catch(() => process.exit(1));
        " && echo "✅ R2 seed OK: $(wc -l < .github/data/filtered-samples.jsonl) entries" || \
          echo "⚠️ No filtered-samples.jsonl in private R2 — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed tag-history.jsonl from R2 (private R2 only)"
      run: |
        echo "📥 Seeding tag history..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('tag-history.jsonl', '.github/data/tag-history.jsonl');
          if (result) { console.log('R2_OK'); } else { process.exit(1); }
        }
        main().catch(() => process.exit(1));
        " && echo "✅ R2 seed OK: $(wc -l < .github/data/tag-history.jsonl) entries" || \
          echo "⚠️ No tag-history.jsonl in private R2 — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}




    - name: "Seed wd-family-cache.json from R2 (fallback: start fresh)"
      run: |
        echo "📥 Seeding WD family cache..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('wd-family-cache.json', '.github/data/wd-family-cache.json');
          if (result) {
            console.log('R2_OK:' + Math.round(result.size/1024) + 'KB');
          } else {
            process.exit(1);
          }
        }
        main().catch(e => { console.error('R2 seed error: ' + e.message); process.exit(1); });
        " && \
          echo "✅ R2 seed OK: $(python3 -c "import json; print(len(json.load(open('.github/data/wd-family-cache.json')).get('tenants', {})) )" 2>/dev/null || echo '?') tenants" || \
          echo "⚠️ No wd-family-cache.json yet — first run will build it"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Seed wd-totals-cache.json from R2 (fallback: git checkout)"
      run: |
        echo "📥 Seeding WD incremental cache..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const fs = require('fs');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('wd-totals-cache.json', '.github/data/wd-totals-cache.json');
          if (result) {
            const { readFileSync } = require('fs');
            const tenants = Object.keys(JSON.parse(readFileSync('.github/data/wd-totals-cache.json', 'utf8'))).length;
            console.log('✅ R2 seed OK: ' + tenants + ' tenants');
          } else {
            console.log('⚠️ R2 returned null or empty for wd-totals-cache.json');
            process.exit(1);
          }
        }
        main().catch(e => { console.error('R2 seed error: ' + e.message); process.exit(1); });
        " || \
          echo "⚠️ R2 miss — using git checkout version (may be stale)" && \
          [ -f ".github/data/wd-totals-cache.json" ] && \
          echo "  Git version: $(python3 -c "import json; print(len(json.load(open('.github/data/wd-totals-cache.json'))))" 2>/dev/null || echo '?') tenants" || \
          echo "⚠️ No wd-totals-cache.json found — starting fresh"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


    - name: "Seed wd-segment-cache.json from R2 (fallback: start fresh)"
      run: |
        echo "📥 Seeding WD segment rotation cache..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('wd-segment-cache.json', '.github/data/wd-segment-cache.json');
          if (result) { console.log('✅ R2 seed OK'); } else { process.exit(1); }
        }
        main().catch(e => { console.error('R2 seed error: ' + e.message); process.exit(1); });
        " || echo "⚠️ No wd-segment-cache.json in R2 — starting fresh (first run will create it)"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    - name: "Seed descriptions-workday.jsonl from R2 (private R2 only)"
      run: |
        echo "📥 Seeding WD description cache (AGG-FETCH-11)..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const fs = require('fs');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const result = await r2.downloadToFile('descriptions-workday.jsonl', '.github/data/descriptions-workday.jsonl');
          if (result) {
            console.log('R2_OK:' + Math.round(result.size/1024) + 'KB');
            return;
          }
          // AGG-WD-SIDECAR-LIFECYCLE-1: the canonical WD sidecar may be chunked
          // (descriptions-workday-1..N.jsonl, 40MB standard). Concat all chunks into the
          // local single file — same pattern as the desc-backfill seed step.
          console.log('single descriptions-workday.jsonl absent — trying chunks...');
          fs.writeFileSync('.github/data/descriptions-workday.jsonl', '');
          let got = 0;
          for (let i = 1; i <= 24; i++) {
            const chunk = await r2.downloadToFile('descriptions-workday-' + i + '.jsonl', '/tmp/wd-chunk-' + i + '.jsonl');
            if (!chunk) break;
            fs.appendFileSync('.github/data/descriptions-workday.jsonl', fs.readFileSync('/tmp/wd-chunk-' + i + '.jsonl'));
            got++;
          }
          if (got === 0) { console.log('⚠️ No WD sidecar (single or chunks) in R2 — starting fresh'); process.exit(1); }
          console.log('R2_OK: ' + got + ' chunk(s) concatenated');
        }
        main().catch(e => { console.error('R2 seed error: ' + e.message); process.exit(1); });
        " && \
          echo "✅ R2 seed OK: $(wc -l < .github/data/descriptions-workday.jsonl) descriptions" || \
          echo "⚠️ No descriptions-workday sidecar in private R2 — starting fresh (first run will build it)"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


    - name: "Seed supplemental lane artifacts from R2"
      run: |
        echo "📥 Seeding supplemental lane artifacts..."
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const path = require('path');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const files = [
            'supplemental-oracle-jobs.json',
            'supplemental-oracle-metadata.json',
            'supplemental-custom-jobs.json',
            'supplemental-custom-metadata.json',
          ];
          let ok = 0;
          for (const file of files) {
            try {
              const result = await r2.downloadToFile(file, path.join('.github/data', file));
              if (result) ok++;
            } catch {}
          }
          console.log('SEEDED:' + ok);
          if (ok === 0) process.exit(1);
        }
        main().catch(() => process.exit(1));
        " && echo "✅ Supplemental artifacts seeded from R2" || echo "⚠️ No supplemental artifacts available yet"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: Pre-pipeline integrity check
      run: |
        echo "🔍 Pre-pipeline integrity check (TAG-AUDIT-4)..."
        FAIL=false

        # Count files in aggregator submodule (should be ~46)
        AGG_DIR=".github/scripts/aggregator"
        if [ -d "$AGG_DIR" ]; then
          FILE_COUNT=$(find "$AGG_DIR" -type f | wc -l)
          if [ "$FILE_COUNT" -lt 30 ]; then
            echo "❌ Aggregator submodule has only $FILE_COUNT files (expected ~46) — incomplete tree!"
            FAIL=true
          else
            echo "✅ Aggregator submodule: $FILE_COUNT files"
          fi
        else
          echo "❌ Aggregator submodule directory missing!"
          FAIL=true
        fi

        # Critical file checks (must exist with reasonable size)
        declare -A CRITICAL_FILES=(
          ["$AGG_DIR/lib/processors/tag-engine.js"]=3000
          ["$AGG_DIR/lib/processors/tag-monitor.js"]=500
          ["$AGG_DIR/lib/processors/senior-filter.js"]=100
          ["$AGG_DIR/lib/processors/deduplicator.js"]=100
          ["$AGG_DIR/lib/fetchers/company-list.json"]=50000
          ["$AGG_DIR/lib/fetchers/workday.js"]=200
          ["$AGG_DIR/lib/fetchers/greenhouse.js"]=200
          ["$AGG_DIR/lib/fetchers/ashby.js"]=200
          ["$AGG_DIR/lib/fetchers/lever.js"]=200
          ["$AGG_DIR/lib/storage/r2-client.js"]=100
        )

        for file in "${!CRITICAL_FILES[@]}"; do
          min_size=${CRITICAL_FILES[$file]}
          basename=$(basename "$file")
          if [ ! -f "$file" ]; then
            echo "❌ $basename MISSING"
            FAIL=true
          else
            size=$(wc -c < "$file")
            if [ "$size" -lt "$min_size" ]; then
              echo "❌ $basename: $size bytes (expected >$min_size) — likely truncated"
              FAIL=true
            else
              echo "✅ $basename: $size bytes"
            fi
          fi
        done

        if [ "$FAIL" = "true" ]; then
          echo "❌ Pre-pipeline integrity check FAILED — aborting to prevent corrupt output"
          exit 1
        fi
        echo "✅ All integrity checks passed"

    - name: Generate link-health data for metadata (AGG-DEADLINK-PUBLISH-1)
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const fs = require('fs');
        const path = require('path');
        const DATA_DIR = '.github/data';
        const r2 = createR2Client({ prefix: 'data/' });
        (async () => {
          const linkHealth = [];
          for (const file of ['stale-job-tombstones.json', 'stale-job-candidates.json']) {
            const local = path.join(DATA_DIR, file);
            const ok = await r2.downloadToFile(file, local);
            if (!ok) { console.log('  ' + file + ': not available'); continue; }
            const data = JSON.parse(fs.readFileSync(local, 'utf8'));
            const items = data.tombstones || data.dead || [];
            for (const item of items) {
              if (!item.url) continue;
              linkHealth.push({
                repo: item.source || item.group || 'unknown',
                url: item.url,
                status: item.latest_status || 'dead',
                last_checked: item.last_dead_seen_at || item.first_dead_seen_at || null,
                http_code: item.latest_code || null,
                company: item.company_name || null,
                title: (item.title || '').slice(0, 80),
              });
            }
          }
          fs.writeFileSync(path.join(DATA_DIR, 'link-health.json'), JSON.stringify(linkHealth));
          console.log('📋 link-health: ' + linkHealth.length + ' dead links found');
        })().catch(e => { console.error('⚠️ link-health generation failed (non-blocking): ' + e.message); });
        "

    - name: Fetch jobs from all sources
      run: set -o pipefail; node .github/scripts/index.js 2>&1 | tee .github/logs/fetch.log
      env:
        JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

    - name: Post-deploy invariant checks
      run: |
        echo "🔍 Running post-deploy invariant checks..."
        PASS=true

        # 1. all_jobs.json exists and has >20,000 lines
        if [ ! -f ".github/data/all_jobs.json" ]; then
          echo "❌ all_jobs.json missing"
          PASS=false
        else
          LINE_COUNT=$(wc -l < .github/data/all_jobs.json)
          if [ "$LINE_COUNT" -lt 20000 ]; then
            echo "❌ all_jobs.json: $LINE_COUNT lines (expected >20000)"
            PASS=false
          else
            echo "✅ all_jobs.json: $LINE_COUNT lines"
          fi
        fi

        # AGG-US-SNAPSHOT-1: us_jobs.json mirrors the producer-owned US tag contract.
        if [ ! -f ".github/data/us_jobs.json" ]; then
          echo "❌ us_jobs.json missing"
          PASS=false
        else
          US_CHECK=$(python3 -c "
        import json
        total = 0
        bad = 0
        with open('.github/data/us_jobs.json') as f:
          for line in f:
            line = line.strip()
            if not line: continue
            total += 1
            j = json.loads(line)
            if 'us' not in ((j.get('tags') or {}).get('locations') or []):
              bad += 1
        print(f'{total}:{bad}')
        " 2>/dev/null || echo "0:1")
          US_COUNT="${US_CHECK%%:*}"
          US_BAD="${US_CHECK##*:}"
          if [ "$US_COUNT" -lt 10000 ] || [ "$US_BAD" -ne 0 ]; then
            echo "❌ us_jobs.json invalid: $US_COUNT rows, $US_BAD non-US-tagged rows"
            PASS=false
          else
            echo "✅ us_jobs.json: $US_COUNT US-tagged rows"
          fi
        fi

        # 2. tags object present on a sample of records
        TAGGED=$(head -5 .github/data/all_jobs.json | python3 -c "
        import sys, json
        ok = sum(1 for l in sys.stdin if l.strip() and 'tags' in json.loads(l))
        print(ok)
        " 2>/dev/null || echo 0)
        if [ "$TAGGED" -lt 5 ]; then
          echo "❌ tags field missing on sampled records ($TAGGED/5 have it)"
          PASS=false
        else
          echo "✅ tags field present on sampled records"
        fi

        # 3. source field present on records
        SOURCED=$(head -5 .github/data/all_jobs.json | python3 -c "
        import sys, json
        ok = sum(1 for l in sys.stdin if l.strip() and json.loads(l).get('source'))
        print(ok)
        " 2>/dev/null || echo 0)
        if [ "$SOURCED" -lt 5 ]; then
          echo "❌ source field missing on sampled records ($SOURCED/5 have it)"
          PASS=false
        else
          echo "✅ source field present on sampled records"
        fi

        # 4. is_direct_apply field present on at least one JSearch record
        JSEARCH_WITH_FLAG=$(python3 -c "
        import json
        count = 0
        with open('.github/data/all_jobs.json') as f:
          for line in f:
            line = line.strip()
            if not line: continue
            j = json.loads(line)
            if j.get('source') == 'jsearch' and 'is_direct_apply' in j:
              count += 1
              if count >= 1: break
        print(count)
        " 2>/dev/null || echo 0)
        if [ "$JSEARCH_WITH_FLAG" -lt 1 ]; then
          echo "⚠️  is_direct_apply field not yet on JSearch records (may appear after TTL refresh)"
        else
          echo "✅ is_direct_apply present on JSearch records"
        fi

        # 5. jobs-metadata.json has freshness and top_companies (new fields from df7e6a4)
        if [ -f ".github/data/jobs-metadata.json" ]; then
          HAS_FRESHNESS=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        print(1 if 'freshness' in m and 'top_companies' in m else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_FRESHNESS" -eq 1 ]; then
            echo "✅ jobs-metadata.json has freshness + top_companies fields"
          else
            echo "❌ jobs-metadata.json missing freshness or top_companies fields"
            PASS=false
          fi

          # AGG-MEASURE-1: rollout projection is an AGG decision contract.
          # If this disappears, future level/source decisions silently fall back to stale prose.
          HAS_SENIOR_PROJECTION=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        p = m.get('senior_rollout_projection') or {}
        ok = (
            isinstance(p.get('sample_basis'), dict)
            and isinstance(p.get('by_source'), dict)
            and isinstance(p.get('by_domain'), dict)
            and isinstance(p.get('by_surface'), dict)
            and p.get('quality', {}).get('surface_projection_exact') is False
        )
        print(1 if ok else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_SENIOR_PROJECTION" -eq 1 ]; then
            echo "✅ jobs-metadata.json has senior_rollout_projection contract"
          else
            echo "::warning::jobs-metadata.json missing valid senior_rollout_projection contract"
            echo "⚠️  Advisory metadata missing; fresh job publish should continue"
          fi

          # AGG-SOURCE-1: source-tier visibility should stay producer-owned, not prose-only.
          HAS_SOURCE_VISIBILITY=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        s = m.get('source_visibility') or {}
        sources = s.get('sources') or {}
        required = {'workday', 'greenhouse', 'ashby'}
        ok = (
            s.get('policy_version') == 'source-tier-a141'
            and isinstance(sources, dict)
            and required.issubset(set(sources.keys()))
            and all(isinstance(sources[src].get('tech_us_jobs'), int) for src in required)
        )
        print(1 if ok else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_SOURCE_VISIBILITY" -eq 1 ]; then
            echo "✅ jobs-metadata.json has source_visibility contract"
          else
            echo "::warning::jobs-metadata.json missing valid source_visibility contract"
            echo "⚠️  Advisory metadata missing; fresh job publish should continue"
          fi

          HAS_LATENCY_MARKERS=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        lm = m.get('latency_markers') or {}
        steps = lm.get('step_timings_ms') or {}
        ok = (
            isinstance(lm.get('pipeline_started_at'), str)
            and isinstance(lm.get('output_ready_at'), str)
            and isinstance(steps.get('step1_fetch_ms'), int)
            and isinstance(steps.get('step8b_sidecars_ms'), int)
            and isinstance(steps.get('step9_write_ms'), int)
        )
        print(1 if ok else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_LATENCY_MARKERS" -eq 1 ]; then
            echo "✅ jobs-metadata.json has latency_markers contract"
          else
            echo "::warning::jobs-metadata.json missing valid latency_markers contract"
            echo "⚠️  Advisory metadata missing; fresh job publish should continue"
          fi
        fi

        # AGG-PIPE-8: File-existence checks for critical submodule files.
        # Origin: d06bb81 deleted tag-engine.js, pipeline produced corrupt output for 7h.

        # 6. tag-engine.js exists and exports expected functions
        TAG_ENGINE_PATH=".github/scripts/aggregator/lib/processors/tag-engine.js"
        if [ ! -f "$TAG_ENGINE_PATH" ]; then
          echo "❌ tag-engine.js MISSING — pipeline will produce corrupt output"
          PASS=false
        else
          TAG_LINE_COUNT=$(wc -l < "$TAG_ENGINE_PATH")
          if [ "$TAG_LINE_COUNT" -lt 100 ]; then
            echo "❌ tag-engine.js: $TAG_LINE_COUNT lines (expected >3000) — likely truncated"
            PASS=false
          else
            echo "✅ tag-engine.js: $TAG_LINE_COUNT lines"
          fi
        fi

        # 7. company-list.json is parseable with expected platforms
        CL_PATH=".github/scripts/aggregator/lib/fetchers/company-list.json"
        if [ ! -f "$CL_PATH" ]; then
          echo "❌ company-list.json MISSING — fetchers have no tenant list"
          PASS=false
        else
          CL_PLATFORMS=$(python3 -c "
        import json
        cl = json.load(open('$CL_PATH'))
        platforms = set(cl.keys())
        required = {'greenhouse', 'lever', 'ashby', 'workday', 'smartrecruiters'}
        missing = required - platforms
        print('MISSING:' + ','.join(missing) if missing else 'OK')
        " 2>/dev/null || echo "MISSING:parse-error")
          if [[ "$CL_PLATFORMS" == MISSING:* ]]; then
            echo "❌ company-list.json missing platforms: ${CL_PLATFORMS#MISSING:}"
            PASS=false
          else
            echo "✅ company-list.json has all required platforms"
          fi
        fi

        # 8. deduplicator.js exports DEDUPE_TTL constants
        DEDUP_PATH=".github/scripts/aggregator/lib/processors/deduplicator.js"
        if [ ! -f "$DEDUP_PATH" ]; then
          echo "❌ deduplicator.js MISSING — pipeline cannot deduplicate"
          PASS=false
        else
          HAS_TTL=$(grep -c "DEDUPE_TTL_DAYS" "$DEDUP_PATH" || echo 0)
          if [ "$HAS_TTL" -lt 1 ]; then
            echo "❌ deduplicator.js missing DEDUPE_TTL_DAYS export"
            PASS=false
          else
            echo "✅ deduplicator.js exports DEDUPE_TTL_DAYS"
          fi
        fi

        if [ "$PASS" = "true" ]; then
          echo "✅ All invariant checks passed"
        else
          echo "❌ One or more invariant checks failed — see above"
          exit 1
        fi


    - name: "Upload pipeline data to Supabase Storage"
