name: Submodule Decrypt Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Step 1 — Parent unlock
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          echo "=== PARENT index.js after unlock ==="
          head -1 .github/scripts/index.js
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Step 2 — Try submodule decrypt (shared)
        run: |
          cd .github/scripts/shared
          echo "=== SHARED before decrypt ==="
          head -1 tools/supply-health-check.js
          
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          rm -f "$(git rev-parse --git-dir)/index"
          git checkout HEAD -- .
          
          echo "=== SHARED after decrypt ==="
          head -1 tools/supply-health-check.js
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Step 3 — Verify parent NOT broken
        run: |
          echo "=== PARENT index.js after submodule decrypt ==="
          head -1 .github/scripts/index.js
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
