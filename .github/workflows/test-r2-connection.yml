name: Test R2 Connection
on:
  workflow_dispatch:

jobs:
  test-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .github/scripts/shared
          npm install

      - name: Test R2 write, read, delete
        working-directory: .github/scripts/shared
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const { S3Client, PutObjectCommand, GetObjectCommand, DeleteObjectCommand } = require('@aws-sdk/client-s3');

          async function test() {
            const client = new S3Client({
              region: 'auto',
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });

            const testKey = 'smoke-test/test-' + Date.now() + '.json';
            const testData = JSON.stringify({ hello: 'zjp', ts: new Date().toISOString() });

            console.log('1. Writing test file to R2...');
            await client.send(new PutObjectCommand({
              Bucket: process.env.R2_BUCKET_NAME,
              Key: testKey,
              Body: testData,
              ContentType: 'application/json',
            }));
            console.log('   WRITE OK');

            console.log('2. Reading test file from R2...');
            const resp = await client.send(new GetObjectCommand({
              Bucket: process.env.R2_BUCKET_NAME,
              Key: testKey,
            }));
            const body = await resp.Body.transformToString();
            const parsed = JSON.parse(body);
            console.log('   READ OK:', JSON.stringify(parsed));
            if (parsed.hello !== 'zjp') throw new Error('Data mismatch!');

            console.log('3. Deleting test file...');
            await client.send(new DeleteObjectCommand({
              Bucket: process.env.R2_BUCKET_NAME,
              Key: testKey,
            }));
            console.log('   DELETE OK');

            console.log('ALL TESTS PASSED');
          }

          test().catch(e => { console.error('FAILED:', e.message); process.exit(1); });
          "
