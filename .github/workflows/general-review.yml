name: Generate General Review

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (midnight US Central)
  workflow_dispatch:

permissions:
  contents: read


jobs:
  generate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout aggregator (with submodule)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install shared dependencies
        run: cd .github/scripts/shared && npm install && cd $GITHUB_WORKSPACE/.github/scripts/aggregator && npm install

      - name: Download all_jobs + sidecars from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          mkdir -p /tmp/review-data
          # AGG-GENERAL-REVIEW-R2-MIGRATION-1: all_jobs.json from R2 canonical (Storage >50MB upload silently fails)
          node -e "const {createR2Client}=require('./.github/scripts/aggregator/lib/storage/r2-client'); const r2=createR2Client({prefix:'data/'}); r2.downloadToFile('all_jobs.json','/tmp/review-data/all_jobs.json').then(r=>console.log('R2 all_jobs:',r?'OK '+r.size+' bytes':'FAILED')).catch(e=>{console.error(e.message);process.exit(1)})"
          echo "  $(wc -l < /tmp/review-data/all_jobs.json) jobs"
          # AGG-GENERALREVIEW-DESCSIDECARS-1: sidecars from R2 too — Storage retired the legacy per-source
          # files (only ENR enriched shards remain there), so the old Storage filter downloaded 0 sidecars and
          # every company's Desc% rendered 0%. R2 data/ holds the full sidecar universe (per-source + enriched
          # shards, ~900MB); prepare-general-review.js's id-keyed map makes overlap harmless (last-wins).
          node -e "const {createR2Client}=require('./.github/scripts/aggregator/lib/storage/r2-client'); const r2=createR2Client({prefix:'data/'}); r2.list('descriptions-').then(async items=>{ let ok=0; for(const it of items){ const name=(it.Key||it.key||it.name).replace(/^data\//,''); const r=await r2.downloadToFile(name,'/tmp/review-data/'+name); if(r)ok++; else console.log('FAILED:',name); } console.log('Sidecars downloaded from R2:',ok,'of',items.length); if(ok===0){console.error('No sidecars downloaded — refusing to generate a zero-coverage review');process.exit(1);} }).catch(e=>{console.error(e.message);process.exit(1)})"
          echo "  $(ls /tmp/review-data/descriptions-*.jsonl 2>/dev/null | wc -l) sidecar files"

      - name: Generate general-review.json
        run: |
          cd .github/scripts/aggregator
          node lib/tools/prepare-general-review.js --json /tmp/review-data/all_jobs.json > /tmp/review-data/general-review.json 2>/tmp/review-data/review-stderr.log
          cat /tmp/review-data/review-stderr.log
          echo "Generated: $(wc -c < /tmp/review-data/general-review.json) bytes"
          # Sanity check
          node -e "const d = JSON.parse(require('fs').readFileSync('/tmp/review-data/general-review.json','utf8')); console.log('US General:', d.summary.us_general, '/', d.summary.us_total, '=', d.summary.us_general_rate + '%')"

      - name: Upload general-review.json to Storage (INF-R2-GITCUTOVER-1)
        # Was: cross-repo push to jobs-data-2026 (kept general-review.json in public git).
        # Now: upload to Supabase Storage directly; the zjp-data-proxy Worker serves it from there.
        # The file is untracked from jobs-data-2026, so it no longer lives in public git.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X PUT -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" --data-binary @/tmp/review-data/general-review.json "$SUPABASE_URL/storage/v1/object/pipeline-data/general-review.json"
          echo "✅ UPLOADED:storage general-review.json ($(wc -c < /tmp/review-data/general-review.json) bytes)"
      - name: Upload general-review.json to R2 canonical (AGG-GENERALREVIEW-HOME-1)
        # INF-R2-STALERELIC-CLUSTER-1 single-homing: R2 data/ is the canonical home; Storage is backup.
        # The 2026-08-04 frozen R2 relic existed because this producer stopped dual-writing after re-enable.
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "const fs=require('fs');const {createR2Client}=require('./.github/scripts/aggregator/lib/storage/r2-client'); const r2=createR2Client({prefix:'data/'}); const body=fs.readFileSync('/tmp/review-data/general-review.json'); r2.uploadRaw('general-review.json', body, 'application/json').then(()=>console.log('R2 dual-write OK: general-review.json')).catch(e=>{console.error('R2 upload FAILED:',e.message);process.exit(1);})"
