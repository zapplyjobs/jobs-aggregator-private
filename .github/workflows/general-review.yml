name: Generate General Review

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (midnight US Central)
  workflow_dispatch:

jobs:
  generate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout aggregator (with submodule)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install shared dependencies
        run: cd .github/scripts/shared && npm install

      - name: Download data from jobs-data-2026
        run: |
          mkdir -p /tmp/review-data
          echo "Downloading all_jobs.json..."
          curl -sf -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://raw.githubusercontent.com/zapplyjobs/jobs-data-2026/main/.github/data/all_jobs.json?t=$(date +%s)" \
            -o /tmp/review-data/all_jobs.json
          echo "  $(wc -l < /tmp/review-data/all_jobs.json) jobs"

          echo "Discovering sidecar description files..."
          # Use Contents API to list all descriptions-*.jsonl files dynamically.
          # This auto-discovers new enriched chunks (was hardcoded to 2 of 16, missing WD descriptions).
          SIDECAR_FILES=$(curl -sf -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/zapplyjobs/jobs-data-2026/contents/.github/data" \
            | jq -r '.[] | select(.name | startswith("descriptions-") and endswith(".jsonl")) | .name')
          echo "Found sidecar files:"
          echo "$SIDECAR_FILES"

          echo "Downloading sidecar descriptions..."
          for f in $SIDECAR_FILES; do
            curl -sf -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://raw.githubusercontent.com/zapplyjobs/jobs-data-2026/main/.github/data/$f?t=$(date +%s)" \
              -o "/tmp/review-data/$f" 2>/dev/null && echo "  $f: $(wc -l < /tmp/review-data/$f) entries" || echo "  $f: download failed (skipped)"
          done

      - name: Generate general-review.json
        run: |
          cd .github/scripts/shared
          node tools/prepare-general-review.js --json /tmp/review-data/all_jobs.json > /tmp/review-data/general-review.json 2>/tmp/review-data/review-stderr.log
          cat /tmp/review-data/review-stderr.log
          echo "Generated: $(wc -c < /tmp/review-data/general-review.json) bytes"
          # Sanity check
          node -e "const d = JSON.parse(require('fs').readFileSync('/tmp/review-data/general-review.json','utf8')); console.log('US General:', d.summary.us_general, '/', d.summary.us_total, '=', d.summary.us_general_rate + '%')"

      - name: Push to jobs-data-2026
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth=1 "https://x-access-token:${GH_PAT}@github.com/zapplyjobs/jobs-data-2026.git" /tmp/jobs-data-2026-push
          cp /tmp/review-data/general-review.json /tmp/jobs-data-2026-push/.github/data/general-review.json

          cd /tmp/jobs-data-2026-push
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/general-review.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update general-review.json [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "✅ general-review.json pushed to jobs-data-2026"
