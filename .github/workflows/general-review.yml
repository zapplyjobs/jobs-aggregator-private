name: Generate General Review

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (midnight US Central)
  workflow_dispatch:

permissions:
  contents: read


jobs:
  generate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout aggregator (with submodule)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install shared dependencies
        run: cd .github/scripts/shared && npm install && cd $GITHUB_WORKSPACE/.github/scripts/aggregator && npm install

      - name: Download data from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          mkdir -p /tmp/review-data
          cd .github/scripts/shared
          node - <<'NODE'
          const fs = require('fs');
          const { S3Client, GetObjectCommand, ListObjectsV2Command } = require('@aws-sdk/client-s3');
          const client = new S3Client({
            region: 'auto',
            endpoint: process.env.R2_ENDPOINT,
            credentials: { accessKeyId: process.env.R2_ACCESS_KEY_ID, secretAccessKey: process.env.R2_SECRET_ACCESS_KEY },
          });
          const bucket = process.env.R2_BUCKET_NAME;
          // all_jobs.json + the per-source description sidecars now live on R2 (removed from the
          // jobs-data-2026 repo during the storage cutover). Download directly from R2.
          // Skip enriched-* / greenhouse-* chunks: 40MB+ each, never part of this review report.
          const skip = (key) => key.includes('descriptions-enriched-') || key.includes('descriptions-greenhouse-');
          async function download(key, dest) {
            const r = await client.send(new GetObjectCommand({ Bucket: bucket, Key: key }));
            fs.writeFileSync(dest, await r.Body.transformToString());
          }
          (async () => {
            console.log('Downloading all_jobs.json from R2...');
            await download('data/all_jobs.json', '/tmp/review-data/all_jobs.json');
            const jobs = fs.readFileSync('/tmp/review-data/all_jobs.json', 'utf8').trim().split('\n').filter(Boolean).length;
            console.log(`  ${jobs} jobs`);
            const sidecars = [];
            let tok;
            do {
              const r = await client.send(new ListObjectsV2Command({ Bucket: bucket, Prefix: 'data/descriptions-', ContinuationToken: tok }));
              (r.Contents || []).forEach(o => { if (o.Key.endsWith('.jsonl') && !skip(o.Key)) sidecars.push(o.Key); });
              tok = r.NextContinuationToken;
            } while (tok);
            console.log(`Downloading ${sidecars.length} description sidecars (skipping enriched/greenhouse chunks)...`);
            for (const key of sidecars) {
              const name = key.split('/').pop();
              try { await download(key, `/tmp/review-data/${name}`); console.log(`  ${name}`); }
              catch (e) { console.log(`  ${name}: skipped (${e.message})`); }
            }
          })().catch(e => { console.error('FAIL: ' + e.message); process.exit(1); });
          NODE

      - name: Generate general-review.json
        run: |
          cd .github/scripts/aggregator
          node lib/tools/prepare-general-review.js --json /tmp/review-data/all_jobs.json > /tmp/review-data/general-review.json 2>/tmp/review-data/review-stderr.log
          cat /tmp/review-data/review-stderr.log
          echo "Generated: $(wc -c < /tmp/review-data/general-review.json) bytes"
          # Sanity check
          node -e "const d = JSON.parse(require('fs').readFileSync('/tmp/review-data/general-review.json','utf8')); console.log('US General:', d.summary.us_general, '/', d.summary.us_total, '=', d.summary.us_general_rate + '%')"

      - name: Push to jobs-data-2026
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth=1 "https://x-access-token:${GH_PAT}@github.com/zapplyjobs/jobs-data-2026.git" /tmp/jobs-data-2026-push
          cp /tmp/review-data/general-review.json /tmp/jobs-data-2026-push/.github/data/general-review.json

          cd /tmp/jobs-data-2026-push
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/general-review.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update general-review.json [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "✅ general-review.json pushed to jobs-data-2026"
