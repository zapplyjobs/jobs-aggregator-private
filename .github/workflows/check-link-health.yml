name: Check Link Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  link-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed stale candidate history from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { S3Client, GetObjectCommand } = require('@aws-sdk/client-s3');
          async function main() {
            const client = new S3Client({
              region: 'auto',
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });
            for (const [key, dest] of [
              ['data/stale-job-history.json', 'stale-job-history.prev.json'],
              ['data/jobs-metadata.json', 'jobs-metadata.json'],
            ]) {
              try {
                const obj = await client.send(new GetObjectCommand({ Bucket: process.env.R2_BUCKET_NAME, Key: key }));
                fs.writeFileSync(dest, await obj.Body.transformToString(), 'utf8');
                console.log(`seeded ${dest}`);
              } catch {
                console.log(`no prior ${key}`);
              }
            }
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Run AGG link health sample
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node .github/scripts/check-link-health.js --per-group 8 --write-dead stale-job-candidates.json --history-in stale-job-history.prev.json --write-history stale-job-history.json > agg-link-health.json
          node .github/scripts/build-stale-tombstones.js --history-in stale-job-history.json --output stale-job-tombstones.json
          node .github/scripts/build-link-verification-sample.js --input agg-link-health.json --output link-verification-sample.json
          node .github/scripts/build-source-confidence-sample.js --link-health agg-link-health.json --verification link-verification-sample.json --tombstones stale-job-tombstones.json --metadata jobs-metadata.json --output source-confidence-sample.json
          cat agg-link-health.json
          cat stale-job-candidates.json
          cat stale-job-history.json
          cat stale-job-tombstones.json
          cat link-verification-sample.json
          cat source-confidence-sample.json

      - name: Upload stale candidate outputs to R2
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
          async function main() {
            const client = new S3Client({
              region: 'auto',
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });
            for (const file of ['agg-link-health.json', 'stale-job-candidates.json', 'stale-job-history.json', 'stale-job-tombstones.json', 'link-verification-sample.json', 'source-confidence-sample.json']) {
              if (!fs.existsSync(file)) continue;
              await client.send(new PutObjectCommand({
                Bucket: process.env.R2_BUCKET_NAME,
                Key: `data/${file}`,
                Body: fs.readFileSync(file, 'utf8'),
                ContentType: 'application/json',
              }));
              console.log(`uploaded ${file}`);
            }
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agg-link-health
          path: |
            agg-link-health.json
            stale-job-candidates.json
            stale-job-history.json
            stale-job-tombstones.json
            link-verification-sample.json
            source-confidence-sample.json
