name: Description Backfill (WD+SR)

# AGG-DESC-ASYNC-1: Workday + SmartRecruiters description backfill decoupled from
# the main fetch pipeline. The main fetch-jobs workflow sets SKIP_WD_DESC_BACKFILL=1 +
# SKIP_SR_DESC_BACKFILL=1 + writes wd-desc-queue.jsonl (pending WD jobs with _raw).
# This workflow reads the WD queue (fetchWorkdayDescriptions) + reads all_jobs.json
# for SR jobs (fetchSRDescriptions), fetches up to 1000 descriptions each, appends
# to the sidecars, and uploads to R2. Runs every 10 min — clears backlogs faster
# while removing ~160s from the main fetch hot path.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Seed sidecars + queue + all_jobs from R2 (canonical — post-recovery audit R2-1)
        run: |
          mkdir -p .github/data
          node << 'EOF'
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          const fs = require('fs');
          const r2 = createR2Client({ prefix: 'data/' });
          async function dl(name, dest) {
            try { await r2.downloadToFile(name, dest); console.log('✅ ' + name + ': ' + fs.statSync(dest).size + ' bytes (R2)'); }
            catch(e) { console.log('⚠️ ' + name + ': ' + e.message); }
          }
          (async () => {
            await dl('all_jobs.json', '.github/data/all_jobs.json');
            await dl('wd-desc-queue.jsonl', '.github/data/wd-desc-queue.jsonl');
            // WD sidecar (may be chunked in R2 as -1.jsonl, -2.jsonl, etc.)
            fs.writeFileSync('.github/data/descriptions-workday.jsonl', '');
            try {
              await r2.downloadToFile('descriptions-workday.jsonl', '.github/data/descriptions-workday.jsonl');
              console.log('✅ descriptions-workday: single file (R2)');
            } catch {
              for (let i = 1; i <= 5; i++) {
                try { await r2.downloadToFile('descriptions-workday-' + i + '.jsonl', '/tmp/wd-' + i + '.jsonl'); fs.appendFileSync('.github/data/descriptions-workday.jsonl', fs.readFileSync('/tmp/wd-' + i + '.jsonl')); console.log('  WD chunk ' + i + ' (R2)'); } catch { break; }
              }
            }
            console.log('descriptions-workday: ' + fs.readFileSync('.github/data/descriptions-workday.jsonl','utf8').trim().split('\n').filter(Boolean).length + ' lines');
            await dl('descriptions-smartrecruiters.jsonl', '.github/data/descriptions-smartrecruiters.jsonl');
          })();
          EOF
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


      - name: Fetch WD descriptions
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { fetchWorkdayDescriptions } = require('./.github/scripts/aggregator/lib/fetchers/workday-descriptions');
          const DATA_DIR = '.github/data';
          const queuePath = path.join(DATA_DIR, 'wd-desc-queue.jsonl');
          if (!fs.existsSync(queuePath)) { console.log('No WD queue — skipping WD backfill'); process.exit(0); }
          const queueLines = fs.readFileSync(queuePath, 'utf8').trim().split('\n').filter(Boolean);
          const wdJobs = queueLines.map(line => {
            const q = JSON.parse(line);
            return { id: q.id, location: q.location || '', _raw: { externalPath: q.externalPath, baseUrl: q.baseUrl, site: q.site } };
          });
          console.log('WD queue:', wdJobs.length, 'jobs pending');
          const start = Date.now();
          fetchWorkdayDescriptions(wdJobs, DATA_DIR).then(desc => {
            console.log('WD done:', desc.size, 'cached (' + Math.round((Date.now()-start)/1000) + 's)');
          }).catch(e => { console.error('WD fetch error:', e.message); });
          "

      - name: Fetch SR descriptions
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { fetchSRDescriptions } = require('./.github/scripts/aggregator/lib/fetchers/smartrecruiters-descriptions');
          const DATA_DIR = '.github/data';
          const allJobsPath = path.join(DATA_DIR, 'all_jobs.json');
          if (!fs.existsSync(allJobsPath)) { console.log('No all_jobs.json — skipping SR backfill'); process.exit(0); }
          const srJobs = fs.readFileSync(allJobsPath, 'utf8').trim().split('\n').filter(Boolean)
            .map(line => { try { return JSON.parse(line); } catch { return null; } })
            .filter(j => j && j.source === 'smartrecruiters' && j.company_slug);
          console.log('SR jobs:', srJobs.length, 'total');
          const start = Date.now();
          fetchSRDescriptions(srJobs, DATA_DIR).then(desc => {
            console.log('SR done:', desc.size, 'cached (' + Math.round((Date.now()-start)/1000) + 's)');
          }).catch(e => { console.error('SR fetch error:', e.message); });
          "

      - name: "Verify sidecar integrity (AGG-SIDECAR-ATOMIC-WRITE-1)"
        run: |
          WD_LINES=$(wc -l < .github/data/descriptions-workday.jsonl 2>/dev/null || echo 0)
          if [ "$WD_LINES" -lt 500 ]; then
            echo "⚠️ WD sidecar has only $WD_LINES lines (expected 5000+). Possible seed-download failure."
            echo "Skipping upload to prevent data loss — existing Storage sidecar preserved."
            echo "SKIP_UPLOAD=true" >> $GITHUB_ENV
          else
            echo "✅ WD sidecar OK: $WD_LINES lines"
          fi

      - name: "Upload sidecars to Supabase Storage"
        if: success() && env.SKIP_UPLOAD != 'true'
        continue-on-error: true
        run: node .github/scripts/upload-to-storage.js --bucket pipeline-data --data-dir .github/data --include-wd-sr
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: "Write sidecar completion marker (AGG-DESCBACKFILL-MARKER-1)"
        if: success()
        run: |
          WD_LINES=$(wc -l < .github/data/descriptions-workday.jsonl 2>/dev/null || echo 0)
          SR_LINES=$(wc -l < .github/data/descriptions-smartrecruiters.jsonl 2>/dev/null || echo 0)
          COMPLETED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"sidecars_written_at\": \"${COMPLETED_AT}\", \"wd_entries\": ${WD_LINES}, \"sr_entries\": ${SR_LINES}, \"status\": \"complete\"}" > /tmp/desc-backfill-complete.json
          curl -sf -X PUT \
            "${SUPABASE_URL}/storage/v1/object/pipeline-data/desc-backfill-complete.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -T /tmp/desc-backfill-complete.json || true
          echo "Marker: sidecars complete at ${COMPLETED_AT} (WD=${WD_LINES}, SR=${SR_LINES})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
