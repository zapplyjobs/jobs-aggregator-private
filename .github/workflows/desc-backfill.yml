name: Description Backfill (WD+SR)

# AGG-DESC-ASYNC-1: Workday + SmartRecruiters description backfill decoupled from
# the main fetch pipeline. The main fetch-jobs workflow sets SKIP_WD_DESC_BACKFILL=1 +
# SKIP_SR_DESC_BACKFILL=1 + writes wd-desc-queue.jsonl (pending WD jobs with _raw).
# This workflow reads the WD queue (fetchWorkdayDescriptions) + reads all_jobs.json
# for SR jobs (fetchSRDescriptions), fetches up to 1000 descriptions each, appends
# to the sidecars, and uploads to R2. Runs every 10 min — clears backlogs faster
# while removing ~160s from the main fetch hot path.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Seed sidecars + queue + all_jobs from R2
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const wd = await r2.downloadToFile('descriptions-workday.jsonl', '.github/data/descriptions-workday.jsonl');
            console.log('wd sidecar:', wd ? Math.round(wd.size/1024) + 'KB' : 'not found');
            const sr = await r2.downloadToFile('descriptions-smartrecruiters.jsonl', '.github/data/descriptions-smartrecruiters.jsonl');
            console.log('sr sidecar:', sr ? Math.round(sr.size/1024) + 'KB' : 'not found');
            const queue = await r2.downloadToFile('wd-desc-queue.jsonl', '.github/data/wd-desc-queue.jsonl');
            console.log('wd queue:', queue ? Math.round(queue.size/1024) + 'KB' : 'not found');
            const allJobs = await r2.downloadToFile('all_jobs.json', '.github/data/all_jobs.json');
            console.log('all_jobs:', allJobs ? Math.round(allJobs.size/1024) + 'KB' : 'not found');
          }
          main().catch(e => { console.error('Seed error:', e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Fetch WD descriptions
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { fetchWorkdayDescriptions } = require('./.github/scripts/aggregator/lib/fetchers/workday-descriptions');
          const DATA_DIR = '.github/data';
          const queuePath = path.join(DATA_DIR, 'wd-desc-queue.jsonl');
          if (!fs.existsSync(queuePath)) { console.log('No WD queue — skipping WD backfill'); process.exit(0); }
          const queueLines = fs.readFileSync(queuePath, 'utf8').trim().split('\n').filter(Boolean);
          const wdJobs = queueLines.map(line => {
            const q = JSON.parse(line);
            return { id: q.id, location: q.location || '', _raw: { externalPath: q.externalPath, baseUrl: q.baseUrl, site: q.site } };
          });
          console.log('WD queue:', wdJobs.length, 'jobs pending');
          const start = Date.now();
          fetchWorkdayDescriptions(wdJobs, DATA_DIR).then(desc => {
            console.log('WD done:', desc.size, 'cached (' + Math.round((Date.now()-start)/1000) + 's)');
          }).catch(e => { console.error('WD fetch error:', e.message); });
          "

      - name: Fetch SR descriptions
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { fetchSRDescriptions } = require('./.github/scripts/aggregator/lib/fetchers/smartrecruiters-descriptions');
          const DATA_DIR = '.github/data';
          const allJobsPath = path.join(DATA_DIR, 'all_jobs.json');
          if (!fs.existsSync(allJobsPath)) { console.log('No all_jobs.json — skipping SR backfill'); process.exit(0); }
          const srJobs = fs.readFileSync(allJobsPath, 'utf8').trim().split('\n').filter(Boolean)
            .map(line => { try { return JSON.parse(line); } catch { return null; } })
            .filter(j => j && j.source === 'smartrecruiters' && j.company_slug);
          console.log('SR jobs:', srJobs.length, 'total');
          const start = Date.now();
          fetchSRDescriptions(srJobs, DATA_DIR).then(desc => {
            console.log('SR done:', desc.size, 'cached (' + Math.round((Date.now()-start)/1000) + 's)');
          }).catch(e => { console.error('SR fetch error:', e.message); });
          "

      - name: Upload updated sidecars to R2
        run: |
          node -e "
          const fs = require('fs');
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            for (const f of ['descriptions-workday.jsonl', 'descriptions-smartrecruiters.jsonl']) {
              const fp = '.github/data/' + f;
              if (fs.existsSync(fp)) {
                const ok = await r2.uploadRaw(f, fs.readFileSync(fp), 'application/x-jsonlines');
                console.log(f + ':', ok ? 'OK' : 'FAILED');
              }
          }
          // AGG-DESCBACKFILL-MARKER-1: write completion timestamp marker.
          // Consumers compare desc_backfill_completed_at vs sidecar_read_at (ENR) vs sidecars_written_at (AGG main).
          const marker = {
            desc_backfill_completed_at: new Date().toISOString(),
            run_id: process.env.GITHUB_RUN_ID || null,
            sidecars_updated: ['descriptions-workday.jsonl', 'descriptions-smartrecruiters.jsonl'],
          };
          await r2.uploadRaw('desc-backfill-latest.json', JSON.stringify(marker, null, 2), 'application/json');
          console.log('desc-backfill-latest.json: marker uploaded');
          }
          main().catch(e => { console.error('Upload error:', e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: "Upload sidecars to Supabase Storage (Phase 2 dual-write shadow)"
        if: success()
        continue-on-error: true
        run: node .github/scripts/upload-to-storage.js --bucket pipeline-data --data-dir .github/data --include-wd-sr
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

