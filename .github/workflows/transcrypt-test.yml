name: Transcrypt Decrypt Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          echo "=== AFTER UNLOCK (before submodule fix) ==="
          head -1 .github/scripts/index.js
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Fix submodule index (SUSPECTED CULPRIT)
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          echo "=== AFTER SUBMODULE FIX ==="
          head -1 .github/scripts/index.js

      - name: Final check
        run: |
          echo "=== FINAL STATE ==="
          head -1 .github/scripts/index.js
