name: Refresh AGG Aspect Status
on:
  schedule:
    # AGG-ASPECTCRON-STALE-OFFSETS-1 (INF wave-audit, 2026-08-15): the original comment
    # assumed the wave starts at :00/:15/:30/:45, but the CF Worker fires */5 so wave
    # start drifts across every 5-min mark — a :20 aspect run may read pre-wave state.
    # DECISION (option a, documented acceptance): aspect snapshots are mid-wave tolerant
    # — every aspect carries its own freshness evidence (metric ages, run timestamps,
    # generated_at) so a pre-wave read is visible as such, not silently stale. Fixed
    # offsets retained over wave-linking to keep the aspect path independent of pipeline
    # dispatch health (the monitor must not depend on the thing it monitors).
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: Verify + publish aspect-status (R2-primary via --publish boto3; Storage mirrored below, mirrors refresh-tag-aspect.yml)
        run: python3 .github/scripts/verify-agg-aspect-ci.py --publish > /tmp/agg-aspect-status.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      - name: Dual-write to Supabase Storage (R2-elim Phase 5)
        continue-on-error: true
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --data-binary @/tmp/agg-aspect-status.json \
            "https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/agg-aspect-status.json"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
