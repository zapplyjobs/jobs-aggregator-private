name: Refresh AGG Aspect Status
on:
  schedule:
    # Every 15 min, offset 5 min from pipeline (pipeline runs at :00,:15,:30,:45)
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3
      - run: python3 .github/scripts/verify-agg-aspect-ci.py --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      - name: "Dual-write to Supabase Storage (Phase 5)"
        run: |
          curl -sf "https://zjp-data-proxy.wild-queen-069e.workers.dev/data/agg-aspect-status.json" -o /tmp/agg-aspect-status.json
          curl -sf -X PUT "${SUPABASE_URL}/storage/v1/object/pipeline-data/agg-aspect-status.json" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "Content-Type: application/json" --data-binary @/tmp/agg-aspect-status.json || echo "Storage upload failed (non-blocking)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
