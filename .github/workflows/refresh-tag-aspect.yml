name: Refresh TAG Aspect Status
on:
  schedule:
    # Every 15 min, offset 8 min from pipeline + 3 from AGG's aspect refresh (5,20,35,50)
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: Verify + publish aspect-status (R2-primary --publish writes R2 via boto3; Storage mirrored below)
        continue-on-error: true   # R2 failure shows warning but Storage mirror below still runs
        run: python3 .github/scripts/verify-tag-aspect-ci.py --publish > /tmp/tag-aspect-status.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # B90: GH_PAT for cross-repo access (zjp-dashboard is private; GITHUB_TOKEN can't reach it → false YELLOW "not found")
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      - name: Mirror to Supabase Storage (dual-write; R2 is canonical via --publish above)
        continue-on-error: true
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --data-binary @/tmp/tag-aspect-status.json \
            "https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/tag-aspect-status.json"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
